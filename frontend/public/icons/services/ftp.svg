<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="FTP icon">
  <defs>
    <linearGradient id="body" x1="0" y1="60" x2="0" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#3b9bf0"/>
      <stop offset="1" stop-color="#1f6fc4"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="28" x2="0" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cb0f7"/>
      <stop offset="1" stop-color="#2f86d6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- rear folder tab -->
    <path d="M16 67c0-7.7 6.3-14 14-14h78c8.5 0 9.4 9 15 12h101c7.7 0 14 6.3 14 14v25H16z" fill="url(#tab)"/>
    <path d="M25 60h82c5.5 0 7.7 7.3 14 7.3h99c5 0 9 4 9 9v8H25z" fill="none" stroke="#c9e6ff" stroke-width="1.5" opacity="0.8"/>

    <!-- front folder body -->
    <path d="M6 87c0-8.3 6.7-15 15-15h142c8.2 0 8.9-24 23-24h49c8.3 0 15 6.7 15 15v153c0 5-4 9-9 9H18c-5 0-9-4-9-9z" fill="url(#body)"/>
    <path d="M8 88c0-7.2 5.8-13 13-13h142c9.4 0 9.5-24 23-24h49c7.2 0 13 5.8 13 13" fill="none" stroke="#d8eeff" stroke-width="2" opacity="0.85"/>
    <path d="M9 213h239" stroke="#15599e" stroke-width="2" opacity="0.65"/>
  </g>

  <!-- upload -->
  <path d="M84 184V114" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
  <path d="M63 132l21-22 21 22" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- download -->
  <path d="M172 108v70" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
  <path d="M151 160l21 22 21-22" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
