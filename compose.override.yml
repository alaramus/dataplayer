services:

  db:
    ports:
      - "5432:5432"
    # Development's connections point at this same server, so their pools
    # (POOL_MAX_POOLS × POOL_MAX_SIZE, alive POOL_MAX_IDLE_SECONDS after a
    # connector is deleted) alone reach the default 100, and a full E2E run
    # was refused with "too many clients" beside the application's own.
    command: ["postgres", "-c", "max_connections=300"]

  adminer:
    ports:
      - "8080:8080"

  # Development brings up fixtures for both built-in sources. The SQL files
  # are no longer mounted: they ship inside the postgres adapter, because the
  # same two files are what a service started automatically is filled with.
  prestart:
    command: ["bash", "scripts/prestart-dev.sh"]
    volumes:
      - user-storage:/data/users

  backend:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./frontend
          action: rebuild
          ignore:
            - ./frontend/node_modules
            - ./frontend/dist
            - ./frontend/blob-report
            - ./frontend/test-results
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
      # Development only, and deliberately not in compose.yml: a process that
      # can reach this socket can do to the host whatever the runtime can, and
      # the threat model for allowing it anywhere else is the last item of the
      # phase that introduced managed services.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FASTAPI_ENV: "development"
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SERVICES_ENABLED: "true"
      # The network this project makes, which the backend is already on.
      SERVICE_NETWORK: "dataplayer_default"
      # The volume this project keeps personal storage in, so a backup is
      # written where its owner will find it.
      SERVICE_STORAGE_VOLUME: "dataplayer_user-storage"

  # A Redis for the backend suite to read and write, and for a person to point
  # a connection at while working on that source type. Behind the `tools`
  # profile: a bare `up` never starts it, `--profile tools` (or naming `redis`
  # explicitly) does. The application itself reads the `redis-cache` service
  # when DATA_CACHE_BACKEND=redis, not this one (D103).
  redis:
    image: redis:8
    profiles: ["tools"]
    ports:
      - "6379:6379"

  # An SSH server for the backend suite and for a person to point an SSH
  # connection at while working on that source (D144): host `sshd`, port 2222
  # from the backend, 127.0.0.1:2222 from this machine, user and password
  # `dataplayer`. Published on the loopback only, because that password is in
  # this file. Behind the `tools` profile, like `redis` above. It forwards
  # connections, so `db`, `mysql`, `clickhouse`, `redis` and `rabbitmq` can be
  # reached through it as an SSH tunnel (D282).
  sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: ["tools"]
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: dataplayer
      USER_PASSWORD: dataplayer
      PASSWORD_ACCESS: "true"
    volumes:
      - ./deploy/sshd/allow-forwarding.sh:/custom-cont-init.d/allow-forwarding.sh:ro
    ports:
      - "127.0.0.1:2222:2222"

  # A MySQL and a MariaDB for the backend suite and for a person to point a
  # MySQL connection at: user `root`, password `dataplayer`, host `mysql` or
  # `mariadb` port 3306 from the backend, 127.0.0.1:3307 and 127.0.0.1:3308
  # from this machine. Both, because the one source type speaks to both and
  # they differ exactly where a catalog looks (D228). Published on the loopback
  # only, because that password is in this file. Behind the `tools` profile.
  mysql:
    image: mysql:8.4
    profiles: ["tools"]
    environment:
      MYSQL_ROOT_PASSWORD: dataplayer
    ports:
      - "127.0.0.1:3307:3306"

  mariadb:
    image: mariadb:11.4
    profiles: ["tools"]
    environment:
      MARIADB_ROOT_PASSWORD: dataplayer
    ports:
      - "127.0.0.1:3308:3306"

  # A ClickHouse for the backend suite and for a person to point a ClickHouse
  # connection at: user `default`, password `dataplayer`, host `clickhouse`
  # port 8123 from the backend, 127.0.0.1:8124 from this machine. Published on
  # the loopback only, because that password is in this file. Behind the
  # `tools` profile.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: ["tools"]
    environment:
      CLICKHOUSE_PASSWORD: dataplayer
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8124:8123"

  # A MongoDB for the backend suite and for a person to point a MongoDB
  # connection at: user `root`, password `dataplayer`, authentication database
  # `admin`, host `mongodb` port 27017 from the backend, 127.0.0.1:27018 from
  # this machine. Published on the loopback only, because that password is in
  # this file. Behind the `tools` profile.
  mongodb:
    image: mongo:8.0
    profiles: ["tools"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dataplayer
    ports:
      - "127.0.0.1:27018:27017"

  # A ZooKeeper for the backend suite and for a person to point a ZooKeeper
  # connection at: no authentication, host `zookeeper` port 2181 from the
  # backend, 127.0.0.1:2182 from this machine. Every four-letter word is
  # allowed, because the reports read `mntr`, `srvr`, `cons` and `wchs`.
  # Behind the `tools` profile.
  zookeeper:
    image: zookeeper:3.9
    profiles: ["tools"]
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "127.0.0.1:2182:2181"

  # A Kafka for the backend suite and for a person to point a Kafka connection
  # at, one broker in KRaft mode. A client goes where the broker advertises,
  # so each place gets a listener naming an address it can reach: `kafka:9092`
  # from the backend, 127.0.0.1:9094 from this machine, and 127.0.0.1:9095
  # with SASL PLAIN, user and password `dataplayer` (D304). Behind the `tools`
  # profile.
  kafka:
    image: apache/kafka:4.3.2
    profiles: ["tools"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094,SASL://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094,SASL://127.0.0.1:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,SASL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_NAME_SASL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        user_dataplayer="dataplayer";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:9094:9094"
      - "127.0.0.1:9095:9095"

  # The RabbitMQ the RabbitMQ source tests read (D325): AMQP and the
  # management API on the host's 5673 and 15673, the backend reaching
  # `rabbitmq:5672` and `rabbitmq:15672`; user and password `dataplayer`.
  # Behind the `tools` profile.
  rabbitmq:
    image: rabbitmq:4.3.7-management
    profiles: ["tools"]
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dataplayer
      RABBITMQ_DEFAULT_PASS: dataplayer
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"

  # dataplayer-monitor-agent reporting the machine Docker runs on to the
  # metrics process, started with
  # `docker compose --profile monitor-agent up -d monitor-agent`. It signs
  # under METRICS_DEV_AGENT_KEY, which prestart registers for the first
  # superuser. It reads the host through read-only mounts and the host's
  # process and network namespaces, so it reaches the metrics process at the
  # port Compose publishes; `/:/host` is plain `ro`, as Docker Desktop refuses
  # `rslave` (D130).
  monitor-agent:
    image: alaramus/dataplayer-monitor-agent:latest
    profiles: ["monitor-agent"]
    pid: host
    network_mode: host
    environment:
      DPM_SERVER: 127.0.0.1:${METRICS_UDP_PORT:-9999}
      DPM_KEY: ${METRICS_DEV_AGENT_KEY:-}
      # Docker Desktop's VM calls itself `debuerreotype`.
      DPM_HOSTNAME: dev-agent
      DPM_PROC: /host/proc
      DPM_SYS: /host/sys
      DPM_ROOTFS: /host
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  mailcatcher:
    image: schickling/mailcatcher
    # Behind `tools` while DataPlayer sends no mail of its own; a message sent
    # meanwhile fails, because SMTP_HOST above points here. `e2e` as well,
    # because the playwright service depends on it.
    profiles: ["tools", "e2e"]
    ports:
      - "1080:1080"
      - "1025:1025"

  playwright:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    environment:
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      - PLAYWRIGHT_BASE_URL=http://backend:8000
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
