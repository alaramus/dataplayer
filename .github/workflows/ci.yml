# Three checks: the backend suite with its servers, the frontend's unit,
# type, lint and build checks, and the documentation check.
# tests/core/test_settings.py fails when a required setting is missing from
# the backend job below.
#
# The end-to-end suite is deliberately absent: it needs the database, the
# backend and a dev server at once, and `bunx playwright test` stays local,
# as AGENTS.md describes.

name: ci

on:
  push:
  pull_request:

# A new run for the same ref cancels the one still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The application database the suite inherits its schema from.
      db:
        image: pgvector/pgvector:0.8.1-pg18-trixie
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The Redis the source-type tests read and write. A real server rather
      # than a fake: what those tests are about is what the driver does to one.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The metrics store the metrics tests prepare and write (D126): the image
      # the store's service template starts. It listens on 5433 on the runner
      # because the application database already owns 5432 there.
      timescale:
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The SSH server the SSH source tests sign in to and walk over SFTP
      # (D144). It reads USER_NAME, USER_PASSWORD and PASSWORD_ACCESS below.
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: dataplayer
          USER_PASSWORD: dataplayer
          PASSWORD_ACCESS: "true"
        ports:
          - 2222:2222
      # The MySQL and the MariaDB the MySQL source tests read (D228): both,
      # because the one source type speaks to both.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dataplayer
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdataplayer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dataplayer
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The ClickHouse the ClickHouse source tests read, over HTTP (D267).
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_PASSWORD: dataplayer
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8124:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The MongoDB the MongoDB source tests read (D283). 7.0 rather than 8.0:
      # 8.0's TCMalloc refuses to start on the runner's kernel, 6.19 or newer
      # (SERVER-121912), and the source type needs only 5.0.
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: dataplayer
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The Kafka the Kafka source tests read (D304), advertising the
      # runner's ports as the tests reach them.
      kafka:
        image: apache/kafka:4.3.2
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094,SASL://:9095
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094,SASL://127.0.0.1:9095
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,SASL:SASL_PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_LISTENER_NAME_SASL_SASL_ENABLED_MECHANISMS: PLAIN
          KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: >-
            org.apache.kafka.common.security.plain.PlainLoginModule required
            user_dataplayer="dataplayer";
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        ports:
          - 9094:9094
          - 9095:9095
      # The RabbitMQ the RabbitMQ source tests read (D325): AMQP on 5673 and
      # its management API 10000 ports above, as the tests expect.
      rabbitmq:
        image: rabbitmq:4.3.7-management
        env:
          RABBITMQ_DEFAULT_USER: dataplayer
          RABBITMQ_DEFAULT_PASS: dataplayer
        ports:
          - 5673:5672
          - 15673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      # The ZooKeeper the ZooKeeper source tests read (D297).
      zookeeper:
        image: zookeeper:3.9
        env:
          ZOO_4LW_COMMANDS_WHITELIST: "*"
        ports:
          - 2182:2181
      # The mail server the mail source tests read and send through (D368).
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=alice:dataplayer@example.com,bob:dataplayer@example.com,dave:dataplayer@example.com
            -Dgreenmail.users.login=email
        ports:
          - 3025:3025
          - 3143:3143
      # The S3 store the S3 source tests read (D382); it starts with no
      # arguments, so a service container can run it.
      rustfs:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: dataplayer
          RUSTFS_SECRET_KEY: dataplayer-secret
        ports:
          - 9010:9000
      # Vault in dev mode for the cloud accounts' secret stores (D454); it is
      # configured by its environment alone, so a service container runs it.
      vault:
        image: hashicorp/vault:1.20
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dataplayer
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          SKIP_SETCAP: "true"
        ports:
          - 8210:8200
    env:
      PROJECT_NAME: DataPlayer
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      # Throwaway JWT signing key, long enough for HS256.
      SECRET_KEY: ci-only-jwt-signing-key-at-least-32-bytes
      # urlsafe base64 of exactly 32 bytes, which is what the validator demands.
      # Throwaway: they encrypt nothing that outlives the job. Two different
      # values on purpose — the keys are independent by decision (D63), and one
      # value standing in for both here would hide the day that stops being true.
      CONNECTOR_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      QUERY_CONTENT_KEY: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=
      AI_CONTENT_KEY: QEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFlaW1xdXl8=
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-superuser-password
      USER_STORAGE_ROOT: /tmp/users
      # Where the Redis tests find their server. Database 15 so they never meet
      # anything else that might be in it, and they empty that one as they go.
      TEST_REDIS_URL: redis://localhost:6379/15
      # The Timescale service listens on 5433 here, see the service above.
      TEST_METRICS_STORE_URL: postgresql://postgres:postgres@localhost:5433/app
      # The SSH service signs in as this user; a test that needs a key
      # authorizes one of its own over SFTP first.
      TEST_SSH_URL: ssh://dataplayer:dataplayer@localhost:2222
      # The MySQL and MariaDB services above, signing in as root.
      TEST_MYSQL_URL: mysql://root:dataplayer@127.0.0.1:3307
      TEST_MARIADB_URL: mysql://root:dataplayer@127.0.0.1:3308
      TEST_CLICKHOUSE_URL: clickhouse://default:dataplayer@127.0.0.1:8124
      TEST_MONGODB_URL: mongodb://root:dataplayer@127.0.0.1:27018/?authSource=admin
      TEST_ZOOKEEPER_URL: zookeeper://127.0.0.1:2182
      TEST_KAFKA_URL: kafka://127.0.0.1:9094
      TEST_RABBITMQ_URL: amqp://dataplayer:dataplayer@127.0.0.1:5673
      TEST_CASSANDRA_URL: cassandra://cassandra:cassandra@127.0.0.1:9043
      TEST_SCYLLA_URL: cassandra://cassandra:cassandra@127.0.0.1:9044
      TEST_MAIL_URL: imap://127.0.0.1:3143?smtp=3025
      # backend/scripts/test.sh runs the suite this way, and the private routes
      # exist only in development: without it their tests get a 404.
      FASTAPI_ENV: development
      # Nothing is sent — the one test that reaches the mailer patches the host —
      # but the sender has to be configured or the mailer refuses outright.
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "False"
      EMAILS_FROM_EMAIL: info@example.com
    steps:
      - uses: actions/checkout@v5
      # The Cassandra and the ScyllaDB the Cassandra source tests read (D340).
      # Not services: a service takes no command, and Cassandra's password
      # check is switched on by editing its configuration before it starts,
      # as compose.override.yml does. Started first, so they warm up while the
      # rest of the job runs; the step before pytest waits for both.
      - run: |
          docker run -d --name cassandra -p 9043:9042 -e MAX_HEAP_SIZE=1G -e HEAP_NEWSIZE=256M \
            --entrypoint bash cassandra:5.0 -c "sed -i \
              -e 's/^authenticator: .*/authenticator: PasswordAuthenticator/' \
              -e 's/^authorizer: .*/authorizer: CassandraAuthorizer/' \
              -e 's/^materialized_views_enabled: .*/materialized_views_enabled: true/' \
              -e 's/^user_defined_functions_enabled: .*/user_defined_functions_enabled: true/' \
              -e 's/^sasi_indexes_enabled: .*/sasi_indexes_enabled: true/' \
              /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"
          docker run -d --name scylla -p 9044:9042 scylladb/scylla:2026.3 \
            --smp=1 --memory=750M --overprovisioned=1 --developer-mode=1 \
            --authenticator=PasswordAuthenticator --authorizer=CassandraAuthorizer \
            --auth-superuser-name=cassandra \
            '--auth-superuser-salted-password=\$6\$dataplayer\$gGIHHoZqUhgE4YVKS2u4aliaE1CyijpZ3vqWELCqka5rzwM8hdpgdp.CcmtSttYfJ7Szziwsl8dbln7T9G5yS1'
      # The Docker daemon behind SSH the Docker source reads (D405), and one on
      # TCP with TLS (D418) on a network they share, so the SSH server can
      # tunnel to it as `docker-tls`. Not services: a service is an image
      # already built, and the first is built from deploy/docker-remote; the
      # second leaves its client certificates in the checkout for the tests.
      # Privileged, as every Docker-in-Docker is.
      - run: |
          docker network create docker-stand
          docker build -t dataplayer-docker-remote deploy/docker-remote
          docker run -d --privileged --name docker-remote --network docker-stand \
            -p 127.0.0.1:2223:22 dataplayer-docker-remote
          docker run -d --privileged --name docker-tls --hostname docker-tls --network docker-stand \
            -e DOCKER_TLS_CERTDIR=/certs -e DOCKER_TLS_SAN=DNS:docker-tls,DNS:localhost,IP:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/deploy/docker-tls/certs:/certs" -p 127.0.0.1:2376:2376 docker:29-dind
      # A one-node k3s for the Kubernetes source (D463), as compose starts it:
      # privileged, its administrator's kubeconfig written into the checkout.
      - run: |
          docker run -d --privileged --name k3s --hostname k3s --tmpfs /run --tmpfs /var/run \
            -e K3S_KUBECONFIG_OUTPUT=/output/kubeconfig -e K3S_KUBECONFIG_MODE=644 \
            -v "$GITHUB_WORKSPACE/deploy/k3s:/output" -p 127.0.0.1:6443:6443 \
            rancher/k3s:v1.33.6-k3s1 server --disable=traefik --tls-san=k3s --tls-san=127.0.0.1
      # A PostgreSQL and a Redis that speak only TLS (D446), started as compose
      # starts them: pg-tls makes the certificates both use, and the client's,
      # into the checkout for the tests.
      - run: |
          docker run -d --name pg-tls --hostname pg-tls --entrypoint sh \
            -e POSTGRES_PASSWORD=dataplayer \
            -v "$GITHUB_WORKSPACE/deploy/tls-test/start-postgres.sh:/setup/start-postgres.sh:ro" \
            -v "$GITHUB_WORKSPACE/deploy/tls-test/certs:/certs" \
            -p 127.0.0.1:5442:5432 postgres:18 /setup/start-postgres.sh
          until [ -f deploy/tls-test/certs/server.crt ] && [ -f deploy/tls-test/certs/client-encrypted.key ]; do sleep 1; done
          docker run -d --name redis-tls -v "$GITHUB_WORKSPACE/deploy/tls-test/certs:/certs:ro" \
            -p 127.0.0.1:6390:6390 redis:8 redis-server --port 0 --tls-port 6390 \
            --tls-cert-file /certs/server.crt --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt --tls-auth-clients optional \
            --user default off --user reader on '>dataplayer' '~*' '&*' '+@all'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run ruff check app tests
      - working-directory: backend
        run: uv run mypy app
      - working-directory: backend
        run: uv run lint-imports
      # The suite runs in its own database, `app_test` beside `app`, and never
      # in the application's. It is made here exactly as development's
      # prestart makes it: created, migrated, the agent's tables (D139) and
      # `demo_lab`, which the query tests read and write.
      - working-directory: backend
        run: uv run python app/tests_pre_start.py
      - working-directory: backend
        run: uv run python -m app.prepare_test_database
      # The SSH server ships with AllowTcpForwarding off, and the tunnel tests
      # reach the other services through it (D282); its penalties for sign-ins
      # that fail would refuse the runner midway. A service starts before
      # the checkout, so it cannot mount the script the compose file does;
      # it is run inside it instead, and sshd re-reads its configuration.
      - run: |
          docker cp deploy/sshd/allow-forwarding.sh ${{ job.services.sshd.id }}:/tmp/allow-forwarding.sh
          docker exec ${{ job.services.sshd.id }} sh /tmp/allow-forwarding.sh
          docker exec ${{ job.services.sshd.id }} pkill -HUP -f 'sshd.pam -D'
      # Both CQL servers take a minute or two to listen, and their password
      # store a few seconds more; a sign-in answers only when both are ready.
      - working-directory: backend
        run: uv run python -m tests.utils.wait_for_cql
      # A failure prints one line per test rather than a full traceback, so
      # one broken fixture cannot bury the cause under pages of repeats.
      # --require-services: a developer's run skips the tests of a server that
      # is not up, and here that would be a run green over tests that never
      # ran. A server the suite knows and this job lacks stops the run instead.
      - working-directory: backend
        run: uv run pytest tests/ -q --tb=short --require-services

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - working-directory: frontend
        run: bun install --frozen-lockfile
      # Everything below runs under Node on purpose. vue-tsc under the bun
      # runtime fails to register the .vue extension and Vitest's jsdom workers
      # fail to start; see docs/architecture/frontend.md.
      - working-directory: frontend
        run: npx eslint .
      - working-directory: frontend
        run: npx vue-tsc -b --force
      - working-directory: frontend
        run: npx vitest run

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-docs.sh
