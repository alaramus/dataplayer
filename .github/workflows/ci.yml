# GitHub mirror of .gitlab-ci.yml: the same three checks, so a green run here
# means the same thing as a green pipeline there.
#
# The two files live side by side on purpose. GitLab reads only
# .gitlab-ci.yml and GitHub reads only .github/workflows/*.yml, so the same
# branch can stay green in both forges. When one of them changes, change the
# other the same way: tests/core/test_settings.py fails when a required
# setting is missing from either backend job.
#
# The end-to-end suite is deliberately absent, same as in .gitlab-ci.yml: it
# needs the database, the backend and a dev server at once, and `bunx
# playwright test` stays local, as AGENTS.md describes.

name: ci

on:
  push:
  pull_request:

# Same as `interruptible: true` in .gitlab-ci.yml: a new run for the same
# ref cancels the one still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The application database the suite inherits its schema from.
      db:
        image: postgres:18
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The Redis the source-type tests read and write. A real server rather
      # than a fake: what those tests are about is what the driver does to one.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The metrics store the metrics tests prepare and write (D126): the image
      # the store's service template starts. It listens on 5433 on the runner
      # because the application database already owns 5432 there; in GitLab
      # each service has its own hostname and they share the port.
      timescale:
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The SSH server the SSH source tests sign in to and walk over SFTP
      # (D144). It reads USER_NAME, USER_PASSWORD and PASSWORD_ACCESS below.
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: dataplayer
          USER_PASSWORD: dataplayer
          PASSWORD_ACCESS: "true"
        ports:
          - 2222:2222
    env:
      PROJECT_NAME: DataPlayer
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      # Throwaway JWT signing key, long enough for HS256.
      SECRET_KEY: ci-only-jwt-signing-key-at-least-32-bytes
      # urlsafe base64 of exactly 32 bytes, which is what the validator demands.
      # Throwaway: they encrypt nothing that outlives the job. Two different
      # values on purpose — the keys are independent by decision (D63), and one
      # value standing in for both here would hide the day that stops being true.
      CONNECTOR_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      QUERY_CONTENT_KEY: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=
      AI_CONTENT_KEY: QEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFlaW1xdXl8=
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-superuser-password
      USER_STORAGE_ROOT: /tmp/users
      # Where the Redis tests find their server. Database 15 so they never meet
      # anything else that might be in it, and they empty that one as they go.
      TEST_REDIS_URL: redis://localhost:6379/15
      # The Timescale service listens on 5433 here, see the service above.
      TEST_METRICS_STORE_URL: postgresql://postgres:postgres@localhost:5433/app
      # The SSH service signs in as this user; a test that needs a key
      # authorizes one of its own over SFTP first.
      TEST_SSH_URL: ssh://dataplayer:dataplayer@localhost:2222
      # backend/scripts/test.sh runs the suite this way, and the private routes
      # exist only in development: without it their tests get a 404.
      FASTAPI_ENV: development
      # Nothing is sent — the one test that reaches the mailer patches the host —
      # but the sender has to be configured or the mailer refuses outright.
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "False"
      EMAILS_FROM_EMAIL: info@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - working-directory: backend
        run: uv run ruff check app tests
      - working-directory: backend
        run: uv run mypy app
      - working-directory: backend
        run: uv run lint-imports
      # The service starts as an empty database. In a running stack the schema
      # is applied by the prestart container and pytest inherits it; here there
      # is nothing to inherit, and every test errors with `relation "user"
      # does not exist`. This is what scripts/prestart.sh does, minus the
      # first superuser, which the test fixtures create themselves.
      - working-directory: backend
        run: uv run python app/tests_pre_start.py
      - working-directory: backend
        run: uv run alembic upgrade head
      # LangGraph's tables for the agent, as prestart creates them (D139).
      - working-directory: backend
        run: uv run python -m app.prepare_checkpoints
      # And this is what scripts/prestart-dev.sh adds on top, minus the
      # personal storage, which the tests build for themselves in a temporary
      # directory. Everything the query capability is tested against — writing,
      # DDL and a plan — runs on a real PostgreSQL and reads or writes inside
      # `demo_lab`; a developer inherits that schema from the prestart
      # container and CI has nothing to inherit it from.
      # Use the fixtures bundled with the PostgreSQL adapter.
      - working-directory: backend
        run: uv run python -m app.seed_database
      # A failure prints one line per test rather than a full traceback, so
      # one broken fixture cannot bury the cause under pages of repeats.
      # --require-services: a developer's run skips the tests of a server that
      # is not up, and here that would be a run green over tests that never
      # ran. A server the suite knows and this job lacks stops the run instead.
      - working-directory: backend
        run: uv run pytest tests/ -q --tb=short --require-services

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - working-directory: frontend
        run: bun install --frozen-lockfile
      # Everything below runs under Node on purpose. vue-tsc under the bun
      # runtime fails to register the .vue extension and checks nothing at all
      # while exiting 0; the trap is written up in AGENTS.md.
      - working-directory: frontend
        run: npx eslint .
      - working-directory: frontend
        run: npx vue-tsc -b --force
      - working-directory: frontend
        run: npx vitest run

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-docs.sh
