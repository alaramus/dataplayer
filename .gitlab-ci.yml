# The pipeline runs the commands ENGINEERING.md lists under "What holds it up",
# and nothing else: a green pipeline has to mean the same thing as a green run
# on a developer machine.
#
# The end-to-end suite is deliberately absent. It needs the database, the
# backend and a dev server at once, which on a shared runner means
# docker-in-docker; until that runner exists, `bunx playwright test` is run
# locally, as AGENTS.md describes.

stages:
  - check

default:
  interruptible: true

backend:
  stage: check
  image: ghcr.io/astral-sh/uv:bookworm-slim
  services:
    - name: postgres:18
      alias: db
    # The Redis the source-type tests read and write. A real server rather
    # than a fake: what those tests are about is what the driver does to one.
    - name: redis:8
      alias: redis
    # The metrics store the metrics tests prepare and write (D126): the image
    # the store's service template starts.
    - name: timescale/timescaledb:2.30.0-pg18
      alias: timescale
  variables:
    POSTGRES_DB: app
    POSTGRES_PASSWORD: postgres
    # Settings come from the environment here. There is no ../.env in a
    # checkout and pydantic-settings does not need one.
    PROJECT_NAME: DataPlayer
    DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    # Throwaway JWT signing key, long enough for HS256.
    SECRET_KEY: ci-only-jwt-signing-key-at-least-32-bytes
    # urlsafe base64 of exactly 32 bytes, which is what the validator demands.
    # Throwaway: they encrypt nothing that outlives the job. Two different
    # values on purpose — the keys are independent by decision (D63), and one
    # value standing in for both here would hide the day that stops being true.
    CONNECTOR_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    QUERY_CONTENT_KEY: ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=
    FIRST_SUPERUSER: admin@example.com
    FIRST_SUPERUSER_PASSWORD: ci-superuser-password
    USER_STORAGE_ROOT: /tmp/users
    # Where the Redis tests find their server. Database 15 so they never meet
    # anything else that might be in it, and they empty that one as they go.
    TEST_REDIS_URL: redis://redis:6379/15
    # The Timescale service reads POSTGRES_PASSWORD and POSTGRES_DB like the
    # database service; the tests make a database of their own in it.
    TEST_METRICS_STORE_URL: postgresql://postgres:postgres@timescale:5432/app
    # backend/scripts/test.sh runs the suite this way, and the private routes
    # exist only in development: without it their tests get a 404.
    FASTAPI_ENV: development
    # Nothing is sent — the one test that reaches the mailer patches the host —
    # but the sender has to be configured or the mailer refuses outright.
    SMTP_HOST: localhost
    SMTP_PORT: "1025"
    SMTP_TLS: "False"
    EMAILS_FROM_EMAIL: info@example.com
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  script:
    - cd backend
    - uv sync --frozen
    - uv run ruff check app tests
    - uv run mypy app
    - uv run lint-imports
    # The service starts as an empty database. In a running stack the schema is
    # applied by the prestart container and pytest inherits it; here there is
    # nothing to inherit, and every test errors with `relation "user" does not
    # exist`. This is what scripts/prestart.sh does, minus the first superuser,
    # which the test fixtures create themselves.
    - uv run python app/tests_pre_start.py
    - uv run alembic upgrade head
    # And this is what scripts/prestart-dev.sh adds on top, minus the personal
    # storage, which the tests build for themselves in a temporary directory.
    # Everything the query capability is tested against — writing, DDL and a
    # plan — runs on a real PostgreSQL and reads or writes inside `demo_lab`;
    # a developer inherits that schema from the prestart container and CI has
    # nothing to inherit it from.
    # Use the fixtures bundled with the PostgreSQL adapter.
    - uv run python -m app.seed_database
    # A failure prints one line per test rather than a full traceback: 419
    # errors at once overran GitLab's 4 MB log limit and hid the cause.
    - uv run pytest tests/ -q --tb=short

frontend:
  stage: check
  image: node:24-bookworm-slim
  variables:
    BUN_INSTALL: /usr/local
  before_script:
    - npm install --global bun
  script:
    - cd frontend
    - bun install --frozen-lockfile
    # Everything below runs under Node on purpose. vue-tsc under the bun
    # runtime fails to register the .vue extension and checks nothing at all
    # while exiting 0; the trap is written up in AGENTS.md.
    - npx eslint .
    - npx vue-tsc -b --force
    - npx vitest run

docs:
  stage: check
  image: alpine:3
  before_script:
    - apk add --no-cache bash git
    # check-docs.sh asks git which files are tracked, and git refuses a
    # checkout owned by another user without this.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - bash scripts/check-docs.sh
