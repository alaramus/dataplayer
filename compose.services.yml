# Managed services in a running installation (D82, D86), added to COMPOSE_FILE
# by `scripts/setup.py --mode prod --enable-services` together with
# SERVICES_ENABLED, SERVICE_NETWORK and SERVICE_STORAGE_VOLUME.
#
# A process that can reach this socket can do to the host whatever the runtime
# can, so no preset includes this file. Development mounts the socket in
# compose.override.yml and needs nothing here.

services:
  backend:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
