# Named here rather than taken from the directory: containers and volumes keep
# the same names whatever the checkout is called.
name: dataplayer

# The environment of anything built from the backend image. Named once so a new
# variable cannot be added to the application and forgotten in prestart.
x-backend-environment: &backend-environment
  PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
  SECRET_KEY: ${SECRET_KEY:?Variable not set}
  CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:?Variable not set}
  QUERY_CONTENT_KEY: ${QUERY_CONTENT_KEY:?Variable not set}
  AI_CONTENT_KEY: ${AI_CONTENT_KEY:?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
  FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
  USER_STORAGE_ROOT: /data/users
  SERVICES_ENABLED: ${SERVICES_ENABLED:-false}
  DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
  SERVICE_NETWORK: ${SERVICE_NETWORK:-}
  SERVICE_MEMORY_MB: ${SERVICE_MEMORY_MB:-1024}
  SERVICE_CPUS: ${SERVICE_CPUS:-1.0}
  SERVICE_PIDS_LIMIT: ${SERVICE_PIDS_LIMIT:-512}
  SERVICE_MAX_PER_USER: ${SERVICE_MAX_PER_USER:-5}
  SERVICE_STORAGE_VOLUME: ${SERVICE_STORAGE_VOLUME:-}
  METRICS_UDP_HOST: ${METRICS_UDP_HOST:-0.0.0.0}
  METRICS_UDP_PORT: ${METRICS_UDP_PORT:-9999}
  METRICS_DEV_AGENT_KEY: ${METRICS_DEV_AGENT_KEY:-}
  DATA_CACHE_BACKEND: ${DATA_CACHE_BACKEND:-memory}
  DATA_CACHE_DEPLOYMENT: ${DATA_CACHE_DEPLOYMENT:-development}
  DATA_CACHE_REDIS_URL: ${DATA_CACHE_REDIS_URL:-}
  DATA_CACHE_SECRET_KEY: ${DATA_CACHE_SECRET_KEY:-}
  DATA_CACHE_REDIS_TIMEOUT_SECONDS: ${DATA_CACHE_REDIS_TIMEOUT_SECONDS:-1}
  # Each process writes its log here as well as to standard output, so the log
  # outlives the container and the log panel can read it (D184).
  LOG_DIR: /app/logs
  LOG_FILE_MAX_BYTES: ${LOG_FILE_MAX_BYTES:-10485760}
  LOG_FILE_COUNT: ${LOG_FILE_COUNT:-5}

services:

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  # The shared read cache, started with the stack. Disposable by construction:
  # no volume, no persistence, and nothing in it that the database does not
  # already hold. Whether the backend actually uses it is still a question for
  # DATA_CACHE_BACKEND, which is answered in .env (D103).
  redis-cache:
    image: redis:8
    environment:
      # No default: a fallback here would start the cache under one password
      # while DATA_CACHE_REDIS_URL carried another, and the backend would report
      # a degraded cache rather than a missing setting.
      REDIS_PASSWORD: ${DATA_CACHE_REDIS_PASSWORD:?Variable not set}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --save '' --appendonly no --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Everything the database needs before the application may serve a request:
  # wait for the server, migrate to head, create the first superuser. It runs
  # to completion and exits, and the backend waits for that exit, so migrations
  # happen once rather than once per worker process, and a failed migration is
  # a failed container with a log rather than an application that did not come
  # up.
  prestart:
    image: backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: ["bash", "scripts/prestart.sh"]
    environment: *backend-environment
    # init_db creates the home directory of the first superuser, so this writes
    # to USER_STORAGE_ROOT and needs the same volume as the application.
    volumes:
      - user-storage:/data/users

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
      # Waited for rather than merely started: a cache that is not answering
      # yet is a cache miss, so the first reads after a restart would go to
      # the source and the accelerator would look broken at exactly the moment
      # somebody is watching it.
      redis-cache:
        condition: service_healthy
    environment: *backend-environment

    volumes:
      - user-storage:/data/users
      - app-logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile

  # The one process that receives agent packets and writes samples to the
  # metrics store (D127). The same image as the backend; it waits while no
  # store is set up. Source changes need `docker compose up -d --build metrics`.
  metrics:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    command: ["python", "-m", "app.metrics.collector"]
    environment: *backend-environment
    # The backend reads this process's log file from the same volume.
    volumes:
      - app-logs:/app/logs
    ports:
      - "${METRICS_UDP_PORT:-9999}:${METRICS_UDP_PORT:-9999}/udp"
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile

volumes:
  app-db-data:
  user-storage:
  app-logs:
