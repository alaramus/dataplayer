# What the Kubernetes tests expect on the k3s stand, applied by the fixture in
# kubernetes_fixture.py as a person would apply it with kubectl.
apiVersion: v1
kind: Namespace
metadata:
  name: dp-test
  labels:
    purpose: dataplayer-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dp-test
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: echo
          image: busybox:1.37
          command: ["sh", "-c", "i=0; while true; do echo line $i; i=$((i+1)); sleep 2; done"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dp-test
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: dp-test
data:
  greeting: hello
  mode: test
---
apiVersion: v1
kind: Secret
metadata:
  name: password
  namespace: dp-test
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: '{"data":{"password":"c2VjcmV0LXZhbHVl"}}'
type: Opaque
data:
  password: c2VjcmV0LXZhbHVl
